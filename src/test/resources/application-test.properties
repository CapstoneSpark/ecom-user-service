# Test Configuration
spring.application.name=user-service-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration (same as production for consistency)
app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A
app.jwtExpirationMs=3600000

# Logging
logging.level.com.ecommerce.userservice=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN